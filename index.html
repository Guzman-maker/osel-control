<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>Osel Control — Clientes y Compras</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f5f9;--c:#fff;--t:#1b2430;--m:#5f6b7a;--a:#0b4a9c;--b:#dbe2ec;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141b;--c:#18202b;--t:#e8edf3;--m:#93a0b2;--b:#2a3442;--a:#3b82d6}}
:root[data-theme=dark]{--bg:#0f141b;--c:#18202b;--t:#e8edf3;--m:#93a0b2;--b:#2a3442;--a:#3b82d6}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--b)}
header h1{font-size:17px;margin:0 8px 0 0;color:var(--a)}nav{display:flex;gap:4px;flex-wrap:nowrap;order:3;flex:1 1 100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.logo{height:38px;width:auto;background:#fff;border-radius:8px;padding:2px 6px;margin-right:auto}
nav button{white-space:nowrap;flex:0 0 auto;border:0;background:none;color:var(--m);padding:7px 11px;border-radius:8px;font:inherit;cursor:pointer}nav .on{background:var(--a);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}footer{text-align:center;color:var(--m);padding:16px;font-size:13px}a{color:var(--a);cursor:pointer}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px}h4{margin:12px 0 6px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.kp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}
.kp div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.kp b{display:block;font-size:20px}.kp span{color:var(--m);font-size:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--b);vertical-align:top}th{color:var(--m);font-weight:600;white-space:nowrap}
input,select,textarea,button{font:inherit;color:inherit}label{display:block;font-size:13px;color:var(--m);margin:8px 0}
input,select,textarea{font-size:16px;display:block;width:100%;padding:8px;margin-top:3px;border:1px solid var(--b);border-radius:8px;background:var(--bg)}input[type=checkbox]{display:inline;width:auto}
button{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:7px 12px;cursor:pointer}button.p{background:var(--a);color:#fff;border-color:var(--a)}button.x{color:var(--a)}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar input{flex:1;min-width:150px;margin:0}
.br{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}.br i{display:block;height:12px;background:var(--a);border-radius:6px;min-width:2px}
dialog{width:min(640px,94vw);max-height:90vh;overflow:auto;border:1px solid var(--b);border-radius:14px;background:var(--c);color:var(--t)}dialog::backdrop{background:#0008}
.pt{border:1px dashed var(--b);border-radius:10px;padding:8px 10px;margin:8px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tot{font-weight:700;font-size:17px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:9px 16px;border-radius:20px;display:none;z-index:9}
.lg{max-width:360px;margin:8vh auto}.mu{color:var(--m)}pre{white-space:pre-wrap}
input.sw{-webkit-appearance:none;appearance:none;display:inline-block;width:40px;height:22px;padding:0;margin:0 8px 0 0;border:0;border-radius:11px;background:var(--b);position:relative;vertical-align:middle;cursor:pointer}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.sw:checked{background:var(--a)}.sw:checked:after{left:20px}
.rs{max-height:230px;overflow:auto;border:1px solid var(--b);border-radius:8px;margin-top:4px}.rs:empty{display:none}.rs button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--b);border-radius:0;padding:9px 10px}.rs small{color:var(--m)}
@media(max-width:560px){.br{grid-template-columns:80px 1fr auto}}
</style><style>
header{flex-direction:column;align-items:stretch;gap:12px;background:var(--bg);padding:14px}
.h1{display:flex;align-items:center;gap:10px}.logo{height:40px;width:auto;background:none;padding:0;margin:0}.ct{font-size:26px;color:#8aa4cc;font-weight:500}
.h2{display:flex;align-items:center;gap:10px}.h2 .mu{flex:1;font-size:14px}.av{width:38px;height:38px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.sal{border:1px solid #cfd6e2;border-radius:12px;padding:10px 18px;font-size:16px;background:var(--bg);color:var(--t)}
nav{order:0;flex:none;background:var(--c);border:1px solid var(--b);border-radius:999px;padding:5px;gap:2px}
nav button{border-radius:999px;padding:9px 16px;font-size:15px}nav .on{background:#5d7396;color:#fff}
.kp{grid-template-columns:repeat(2,1fr)}.kp div{position:relative;border-radius:16px;padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.kp svg{position:absolute;right:14px;top:14px;width:30px;height:30px;stroke:var(--m);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.kp b{font-size:24px}.kp span{font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:22px;font:500 15px Roboto,Arial,sans-serif;cursor:pointer}
.gbtn:hover{background:#f7f8f8}
html{overflow-x:hidden;overscroll-behavior-x:none}body{overflow-x:clip;max-width:100vw}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;flex-wrap:nowrap;min-width:0;max-width:100%}
.h1,.h2{min-width:0}.h2 .mu{min-width:0;overflow-wrap:anywhere}
nav{display:flex;flex-wrap:nowrap;width:100%;max-width:100%;min-width:0;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}nav button{flex:0 0 auto;white-space:nowrap}
main{min-width:0}.grid{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}

    return`<tr style="page-break-inside:avoid"><td style="${td}"><b>${E(i.nom)}</b>${i.lote?`<span style="color:${G}"> · Lote ${E(i.lote)}</span>`:''}${det?`<div style="font-size:10.5px;color:#475569;margin-top:3px;line-height:1.4">${det}</div>`:''}</td><td style="${td};text-align:center">${i.cant}</td><td style="${td};text-align:right">${$$(i.pu)}</td><td style="${td};text-align:center">${i.desc?i.desc+'%':'—'}</td><td style="${td};text-align:right;font-weight:700">${$$(i.sub)}</td></tr>`}).join(''),
  th=`padding:8px 6px;font-size:11px;color:${C};font-weight:700;border-bottom:2px solid ${C}`,
  li=t=>`<li style="margin-bottom:5px">${t}</li>`,
  box='background:#e8f0fe;border:1px solid #b9cdf5;border-radius:10px;padding:14px 16px',
  cont=[D.cfg.web_neg&&['M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',E(D.cfg.web_neg)],D.cfg.mail_neg&&['M3 6h18v12H3zM3 7l9 7 9-7',E(D.cfg.mail_neg)],D.cfg.tel_neg&&['M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2',E(D.cfg.tel_neg)]].filter(Boolean).map(x=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${x[0]}"/></svg>${x[1]}</span>`).join('');
  return`<div class="cotsheet" style="width:794px;min-height:1118px;background:#fff;color:${T};font-family:Helvetica,Arial,sans-serif;display:flex;flex-direction:column;box-sizing:border-box;line-height:1.35">
<div style="display:flex;align-items:center;padding:28px 40px 20px"><img src="${LOGO}" alt="" style="height:58px;width:auto"><div style="width:1px;height:64px;background:#cfd8e6;margin:0 28px"></div><div><div style="font-size:34px;font-weight:800;color:${T};letter-spacing:.5px">COTIZACIÓN</div><div style="font-size:24px;font-weight:600;color:${C}">DE PRODUCTOS</div></div></div>
<div style="height:6px;background:linear-gradient(90deg,${C} 0,${C} 94%,#dbe7fb 94%)"></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:24px 40px 8px"><div>
${fila('user','Cliente:',E(cli.nom||cn(q.cid)),[cli.tel,cli.email,cli.rfc&&'RFC '+cli.rfc].filter(Boolean).map(E).join(' · '))}
${fila('tag','Folio:',E(q.folio))}
${fila('cal','Fecha:',fLarga(q.emision))}
${fila('doc','Atendió:',E(q.vend))}</div>
<img src="${LOGO}" alt="" style="width:190px;height:auto;margin-right:10px"></div>
<div style="padding:8px 40px 0"><div style="border-top:1px solid #dbe3ef;padding-top:18px">${sec('doc','DETALLE DE PRODUCTOS')}
<table style="width:100%;border-collapse:collapse"><tr><th style="${th};text-align:left">Producto</th><th style="${th};text-align:center">Cant.</th><th style="${th};text-align:right">P. unitario</th><th style="${th};text-align:center">Desc.</th><th style="${th};text-align:right">Importe</th></tr>${rows}</table></div></div>
<div style="display:flex;gap:0;padding:22px 40px 0"><div style="flex:1;padding-right:22px">${sec('usd','COSTO DE LA COTIZACIÓN')}<div style="${box};display:flex;align-items:center;gap:16px"><span style="font-size:18px;font-weight:700;color:${C}">TOTAL:</span><span style="width:1px;height:30px;background:#9db6e8"></span><span style="font-size:30px;font-weight:800;color:${T}">${$$(q.total)} MXN</span></div></div>
<div style="flex:1;padding-left:22px;border-left:1px solid #dbe3ef">${sec('card','CONDICIONES')}<ul style="margin:0;padding-left:18px;font-size:11.5px;color:#334155">${li('Cotización informativa: no representa una venta ni aparta producto.')}${li('Forma de pago contemplada: '+E(q.pago)+'.')}${li('Precios y existencias sujetos a cambio después de la vigencia.')}</ul></div></div>
<div style="display:flex;gap:0;padding:22px 40px 24px"><div style="flex:1;padding-right:22px">${sec('clk','VIGENCIA')}<div style="${box};display:flex;align-items:center;gap:14px">${ico(IP.cal,40)}<div><div style="font-size:11px;color:${G}">Vigencia de la cotización:</div><div style="font-size:19px;font-weight:800;color:${C}">Válida hasta el ${fLarga(q.vence)}</div><div style="font-size:11px;color:${T}">${q.vig} días a partir de la fecha de emisión</div></div></div></div>
<div style="flex:1;padding-left:22px;border-left:1px solid #dbe3ef">${sec('inf','NOTAS ADICIONALES')}<ul style="margin:0;padding-left:18px;font-size:11.5px;color:#334155">${li('Para evitar variaciones de tono en obra, se recomienda surtir los botes del mismo lote.')}${li('Los colores igualados se preparan con el código, base y acabado indicados.')}</ul></div></div>
<div style="flex:1"></div>

/* Generar cotización desde el carrito */
function cotizar(){
  const f=$('#fv');if(!f)return;
  const vig=+f.vig.value;if(!vig){f.vig.focus();return toast('Elige la vigencia de la cotización (7, 15 o 30 días)')}
  const ps=[...document.querySelectorAll('.pt')];if(!ps.length)return toast('Agrega al menos una partida');
  for(const d of ps){
    if(!d.querySelector('.pid').value){d.querySelector('.q').focus();return toast('Selecciona un producto en cada partida')}
    if(!(+d.querySelector('.cant').value>=1)){d.querySelector('.cant').focus();return toast('Revisa la cantidad de cada partida')}
    if((+d.querySelector('.dsc').value||0)>=1&&!d.querySelector('.dm').value.trim()){d.querySelector('.dm').focus();return toast('Escribe el motivo del descuento')}
    if(d.querySelector('.prp').checked){const r=[...d.querySelectorAll('.rq')].find(x=>!x.value.trim());if(r){r.focus();return toast('Completa los datos del color igualado')}}
  }
  const it=lines();if(it.length<ps.length)return toast('Selecciona un producto en cada partida');
  const c=D.clientes.find(x=>x.id==f.cid.value)||{},em=lhoy();
  D.seq.q=(D.seq.q||0)+1;
  const q={folio:'COT-'+String(D.seq.q).padStart(5,'0'),fecha:new Date().toISOString(),emision:em,vig,vence:sumD(em,vig),cid:c.id,cli:{nom:c.nom,rfc:c.rfc,tel:c.tel,email:c.email},vend:(f.vend.value||U.n).trim(),pago:f.pago.value,items:it,total:it.reduce((a,i)=>a+i.sub,0),estatus_cotizacion:'Pendiente'};
  COT().push(q);save(); // solo guarda la cotización: NO toca D.ventas, métricas ni Pulpos
  verCot(q.folio,true);toast('Cotización '+q.folio+' guardada')}

function verCot(fo,nuevo){const q=COT().find(x=>x.folio==fo);if(!q)return;
  const w=Math.min(640,innerWidth*.94)-40,z=Math.min(1,w/794);
  M(`<div style="overflow:hidden;border:1px solid var(--b);border-radius:8px"><div style="zoom:${z.toFixed(3)}">${cotHTML(q)}</div></div><p class=mu>Estatus: <b>${E(q.estatus_cotizacion)}</b>${vencida(q)?' · <span style="color:#d97706">Vencida</span>':''}${q.venta_folio?' · Venta '+E(q.venta_folio):''}</p><div class=ac><button onclick="${nuevo?"X();V='cot';render()":'X()'}">Cerrar</button><button onclick="pdfCot('${q.folio}')" class=${q.estatus_cotizacion=='Pendiente'?'x':'p'}>Descargar PDF</button>${q.estatus_cotizacion=='Pendiente'?`<button class=p onclick="convertirCot('${q.folio}')">Convertir en Venta</button>`:''}</div>`)}

const loadH2P=()=>window.html2pdf?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js';s.onload=ok;s.onerror=()=>no(new Error('No cargó html2pdf'));document.head.append(s)});
async function pdfCot(fo){const q=COT().find(x=>x.folio==fo);if(!q)return;toast('Generando PDF…');let h;
  try{await loadH2P();h=document.createElement('div');h.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';h.innerHTML=cotHTML(q);document.body.append(h);
    await html2pdf().set({margin:0,filename:'Cotizacion-'+q.folio+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:'tr'}}).from(h.firstElementChild).save();toast('PDF listo')}
  catch(e){console.error(e);toast('No se pudo generar el PDF; abriendo impresión');imprimirCot(fo)}
  finally{h&&h.remove()}}
function imprimirCot(fo){const q=COT().find(x=>x.folio==fo);if(!q)return;const w=window.open('','_blank');if(!w)return toast('Permite ventanas emergentes para imprimir');
  w.document.write('<!doctype html><meta charset=utf-8><title>Cotización '+q.folio+'</title><style>@page{size:A4;margin:0}body{margin:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style>'+cotHTML(q));w.document.close();setTimeout(()=>w.print(),600)}

/* Historial */
views.cot=()=>`<div class=card><h2>Historial de cotizaciones</h2><div class=bar><input placeholder="Buscar por nombre de cliente o folio…" oninput="flt(this)"><button class=p onclick="fV()">+ Nueva cotización</button></div>${tb(['Folio','Fecha','Cliente','Vigencia','Total','Estatus',''],[...COT()].reverse().map(q=>{const nm=(q.cli&&q.cli.nom)||cn(q.cid);return`<tr data-s="${E([q.folio,nm,q.estatus_cotizacion].join(' ').toLowerCase())}"><td>${E(q.folio)}</td><td>${dt(q.fecha)}</td><td>${E(nm)}</td><td>${fLarga(q.vence)}${vencida(q)?'<br><span style="color:#d97706">Vencida</span>':''}</td><td>${$$(q.total)}</td><td>${E(q.estatus_cotizacion)}</td><td><button onclick="verCot('${q.folio}')">Ver / PDF</button>${q.estatus_cotizacion=='Pendiente'?` <button class=p onclick="convertirCot('${q.folio}')">Convertir en Venta</button>`:''}${admin()?` <button class=x onclick="dCot('${q.folio}')">Borrar</button>`:''}</td></tr>`}))}${COT().length?'':'<p class=mu>Aún no hay cotizaciones. Se generan desde Compras → Nueva compra → Generar Cotización.</p>'}</div>`;
const dCot=fo=>admin()&&cf('¿Eliminar esta cotización?',()=>{D.cotizaciones=COT().filter(x=>x.folio!=fo);save();render()});

/* Cotización → Venta */
function convertirCot(fo,ok){const q=COT().find(x=>x.folio==fo);if(!q||q.estatus_cotizacion!='Pendiente')return;
  const dif=q.items.filter(i=>{const p=D.productos.find(x=>x.id==i.pid);return !p||p.precio!=i.pu}).length;
  if(!ok&&(vencida(q)||dif)){const m=[vencida(q)?'La cotización venció el '+fLarga(q.vence)+'.':'',dif?dif+' producto(s) cambiaron de precio o ya no están en el catálogo: la venta usará el precio actual.':''].filter(Boolean).join(' ');if($('#dlg').open)X();return cf(m+' ¿Convertir en venta de todos modos?',()=>convertirCot(fo,1))}
  if($('#dlg').open)X();
  V='com';render();
  COTV=fo;q.estatus_cotizacion='Convertida';save();
  precargarCot(q)}
function precargarCot(q){fV();const f=$('#fv');if(!f)return;
  if([...f.cid.options].some(o=>o.value==q.cid))f.cid.value=q.cid;
  if([...f.pago.options].some(o=>o.value==q.pago))f.pago.value=q.pago;
  $('#pts').innerHTML='';let falt=0;
  q.items.forEach(i=>{const p=D.productos.find(x=>x.id==i.pid);if(!p){falt++;return}
    aP();const d=[...document.querySelectorAll('.pt')].pop(),s=(c,v)=>{d.querySelector(c).value=v??''};
    s('.q',pn(p));const h=d.querySelector('.pid');h.value=p.id;pc(h);
    s('.cant',i.cant);s('.lote',i.lote);s('.dsc',i.desc||0);dd(d.querySelector('.dsc'));if(i.desc)s('.dm',i.dm);
    if(i.prep){const k=d.querySelector('.prp');k.checked=true;pp(k);const b=d.querySelector('.tbs');if(![...b.options].some(o=>o.value==i.tbs))b.add(new Option(i.tbs,i.tbs));b.value=i.tbs;s('.acb',i.ac);s('.cod',i.cod);s('.cn',i.cn);s('.frm',i.form);s('.area',i.area)}});
  tot();toast(falt?'Cotización '+q.folio+' cargada; '+falt+' producto(s) ya no existen en el catálogo':'Cotización '+q.folio+' cargada en el mostrador')}
/* Si se cierra el carrito sin registrar la venta, la cotización vuelve a Pendiente */
$('#dlg').addEventListener('close',()=>{if(!COTV||$('#dlg').open)return;const q=COT().find(x=>x.folio==COTV);COTV=null;
  if(q&&q.estatus_cotizacion=='Convertida'&&!q.venta_folio){q.estatus_cotizacion='Pendiente';save();toast('Venta no registrada: la cotización sigue Pendiente');if(V=='cot')render()}});

verifSus();load();render();boot();
</script></body></html>
